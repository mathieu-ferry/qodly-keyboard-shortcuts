name: 'build'
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install dependencies
        run: npm ci

      - name: build the project
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: qodly-keyboard-shortcuts
          path: qodly_*.zip
