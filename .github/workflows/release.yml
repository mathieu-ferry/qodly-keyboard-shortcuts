name: 'release'
# Push a tag like v0.2.0 (matching package.json "version") to publish a release with the installable zip
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: install dependencies
        run: npm ci

      - name: build the project
        run: npm run build

      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="qodly-keyboard-shortcuts_${GITHUB_REF_NAME}.zip"
          mv qodly_*.zip "$zip"
          gh release create "$GITHUB_REF_NAME" "$zip" --title "$GITHUB_REF_NAME" --generate-notes
